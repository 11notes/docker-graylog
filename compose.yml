name: "log"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  graylog:
    depends_on:
      mongodb:
        condition: "service_healthy"
        restart: true
    image: "11notes/graylog:7.2.2"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
    volumes:
      - "graylog.etc:/graylog/etc"
      - "graylog.var:/graylog/var"
    tmpfs:
      - "/tmp:exec,uid=1000,gid=1000"
    networks:
      frontend:
      backend:
    ports:
      - "3000:9000/tcp"
    restart: "always"

  mongodb:
    image: "11notes/mongodb:9.0.8"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
    networks:
      backend:
    volumes:
      - "mongodb.var:/mongodb/var"
    restart: "always"

volumes:
  graylog.etc:
  graylog.var:
  mongodb.var:

networks:
  frontend:
  backend:
    internal: true